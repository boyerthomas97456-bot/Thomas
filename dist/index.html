function renderBeltChallenge(){state.phase='belt';state.idx=0;state.beltIndex=0;state.beltCorrect=0;state.beltResults=[];const zones=[['1','Peu ou pas transformé','🍎 pomme · avoine'],['2','Ingrédient culinaire','🫒 huile · sucre'],['3','Transformé','🥫 conserve · pain'],['4','Ultra-transformé','🍫 formulation complexe']];const body=`<div class="belt-game"><div class="belt-instructions"><b>🏭 Mission : trie le tapis roulant !</b><br>Glisse chaque aliment dans le groupe NOVA qui correspond. Sur téléphone, tu peux aussi toucher un aliment puis toucher une zone. Tu as quelques secondes par aliment.</div><div class="belt-scoreline"><span id="belt-count">Aliment 1 / ${beltFoods.length}</span><span id="belt-correct">✅ 0 bien classé</span></div><div class="belt-gauge" aria-label="Jauge de bonnes réponses"><i id="belt-gauge-fill"></i></div><div class="belt-clock"><i id="belt-clock-fill"></i></div><div class="belt-stage"><div class="belt-track" id="belt-track"><div class="belt-empty" id="belt-empty">Le tapis va démarrer !<br>🟢 Garde ton doigt sur l’aliment pour le glisser</div></div><div class="belt-sorter" id="belt-sorter"><div class="sorter-speech" id="sorter-speech">Glisse-moi un aliment !</div><span class="sprite sprite-strawberry" role="img" aria-label="Professeur Fraise prêt à attraper l’aliment"></span><div class="sorter-hands">🤲</div><div class="sorter-catch"><span>🧺</span><b id="caught-food">Prêt !</b></div></div></div><div class="nova-zones">${zones.map(z=>`<button class="nova-bin nova-${z[0]}" data-bin="${z[0]}" aria-label="Déposer dans le groupe NOVA ${z[0]}"><strong>NOVA ${z[0]}</strong>${z[1]}<small>${z[2]}</small></button>`).join('')}</div><div class="belt-message" id="belt-message">Le numéro indique le type de transformation. Il ne dit pas à lui seul si l’aliment est bon ou mauvais pour la santé.</div><div class="feedback" id="feed"></div></div>`;shell('Défi 1 · Tapis roulant NOVA','Sauve les aliments avant qu’ils sortent !',body,'Lancer le tapis →',startBeltFood, function startBeltFood(){if(state.phase!=='belt')return;clearTimeout(state.beltTimer);clearTimeout(state.beltAdvanceTimer);if(state.beltIndex>=beltFoods.length){showBeltSummary();return}state.beltResolved=false;state.beltSelected=false;state.dragging=null;const f=beltFoods[state.beltIndex],n=state.beltIndex+1,duration=Math.max(5,7.5-(n-1)*.28),track=document.getElementById('belt-track');document.querySelector('.belt-stage')?.classList.remove('is-catching');document.getElementById('belt-empty')?.remove();track.innerHTML=`<button id="belt-food" class="belt-food" style="--belt-time:${duration}s" aria-label="${f.name} — glisser vers un groupe NOVA"><span class="belt-emoji">${f.emoji}</span><span>${f.name}</span></button>`;document.getElementById('belt-count').textContent=`Aliment ${n} / ${beltFoods.length} · ⏱️ ${duration.toFixed(1).replace('.',',')} s`;document.getElementById('belt-message').className='belt-message';document.getElementById('belt-message').innerHTML='<strong>À toi de jouer !</strong>Glisse l’aliment vers la zone qui lui correspond.';document.getElementById('belt-clock-fill').style.animation='none';void document.getElementById('belt-clock-fill').offsetWidth;document.getElementById('belt-clock-fill').style.animation=`clockRun ${duration}s linear forwards`;document.getElementById('action').textContent='Aliment suivant →';document.getElementById('action').disabled=true;const item=document.getElementById('belt-food');item.addEventListener('pointerdown',e=>{if(state.beltResolved)return;e.preventDefault();const r=item.getBoundingClientRect();state.dragging={startX:e.clientX,startY:e.clientY,offsetX:e.clientX-r.left,offsetY:e.clientY-r.top,moved:false};item.setPointerCapture(e.pointerId)});item.addEventListener('pointermove',e=>{const d=state.dragging;if(!d||state.beltResolved)return;if(Math.hypot(e.clientX-d.startX,e.clientY-d.startY)>8)d.moved=true;if(d.moved){item.classList.add('dragging');item.style.left=(e.clientX-d.offsetX)+'px';item.style.top=(e.clientY- ourceLinks.nova}`;document.querySelector('.points').textContent='⭐ '+state.score;document.getElementById('status').textContent=correct?'Bon tri !':missed?'Aliment manqué':'Le tapis s’arrête pour expliquer';document.getElementById('action').disabled=false;document.getElementById('action').textContent=finished?'Voir le bilan →':'Aliment suivant →';state.beltAdvanceTimer=setTimeout(startBeltFood,missed?2600:2200);}

ondent à la composition utilisée dans le jeu.</div><div class="market-errors">${errorRows}</div><div class="market-nav"><button id="market-replay" type="button">REJOUER</button><button id="market-next" type="button" onclick="window.goToSigaStep()">ÉTAPE SUIVANTE</button></div></div>`;shell('Mission Tri NOVA · bilan','Ta caisse est terminée !',body,'',()=>{},'Relis les explications, puis rejoue ou poursuis les défis.',false);document.querySelector('.actions').classList.add('hidden');document.getElementById('points').textContent='⭐ '+state.score;document.getElementById('status').textContent='Mission terminée';document.getElementById('market-replay').onclick=()=>renderBeltChallenge();document.getElementById('market-next').onclick=window.goToSigaStep};

renderRunner=function(){if(!state.familiesLessonComplete&&state.idx===6){renderFamiliesLesson();return}state.phase='foodrun';refreshProgress(7);const body=`<div id="foodrun3d" class="roof3d foodrun3d"><div class="foodrun-ui"><span id="foodrun-score" class="foodrun-score">⭐ 0</span><div class="foodrun-progress"><i id="foodrun-progress"></i></div><span id="foodrun-hearts" class="foodrun-hearts">❤️❤️❤️</span><button id="foodrun-pause" class="foodrun-pause" type="button">Ⅱ</button></div><div id="foodrun-start" class="foodrun-start"><button type="button">JOUER ▶</button></div></div><p class="foodrun-tip">Glisse à gauche/droite pour changer de voie · glisse vers le haut pour sauter · vers le bas pour glisser.</p>`;shell('Food Run · course 3D','Atteins l’arrivée avec au moins un cœur !',body,'',()=>{},'Trois cœurs, pas de chrono affiché : attrape les aliments à favoriser et évite les obstacles.',false);document.querySelector('.actions').classList.add('hidden');document.querySelector('#foodrun-start button').onclick=()=>window.FoodRun3D?.start(document.getElementById('foodrun3d'),finishFoodRun3D)};
function finishFoodRun3D(result){if(state.phase!=='foodrun')return;state.phase='foodrunDone';state.score+=result.points;const body=`<div class="roof3d-result"><strong>🏆 BRAVO !</strong><b>Tu as terminé Food Run !</b><p>⭐ ${result.points} points · ${result.good} aliments à favoriser récupérés · ${result.bad} aliments à limiter touchés · ${result.obstacles} obstacles heurtés · ${result.hearts} cœur${result.hearts>1?'s':''} restant${result.hearts>1?'s':''}.</p><p>Les aliments à limiter ne sont pas interdits : c’est leur fréquence et l’ensemble du repas qui comptent.</p></div><div class="center" style="margin-top:16px"><button id="foodrun-replay" class="btn alt" type="button">Rejouer</button></div>`;shell('Food Run · arrivée','La ligne d’arrivée est franchie !',body,'Étape suivante →',()=>renderWho(0),'Tu peux rejouer ou continuer vers « Qui suis-je ? ». ',false);document.getElementById('points').textContent='⭐ '+state.score;document.getElementById('foodrun-replay').onclick=()=>renderRunner()}
renderBombBriefing=function(){state.phase='bombBriefing';refreshProgress(10);const body=`<div class="bomb-briefing"><div class="brief-bomb">💣</div><span class="question-label">BILAN FINAL</span><h3>Réponds aux 10 questions récapitulatives.</h3><p>Les questions reprennent NOVA, SIGA, les familles d’aliments, l’assiette, Food Run et les courses. Il n’y a pas de chrono : tu vas au bout à ton rythme.</p><button id="launch-bomb" class="launch-bomb" type="button">COMMENCER LES 10 QUESTIONS 💣</button></div>`;shell('Défi bombe · bilan final','Tout ce que tu as appris !',body,'',()=>{},'Les explications de chaque réponse arrivent à la fin.',false);document.querySelector('.actions').classList.add('hidden');document.getElementById('launch-bomb').onclick=startBombRun};
startBombRun=function(){state.phase='bomb';refreshProgress(10);state.bombHistory=[];state.bombQueue=[...bombRushPool].sort(()=>Math.random()-.5).slice(0,10);const body=`<div class="bomb-rush-head"><div class="rush-bomb" id="rush-bomb">💣</div><div><span class="question-label">RÉCAPITULATIF</span><strong><span id="rush-count">1</span> / 10 questions</strong></div></div><div class="bomb-rush-panel"><div class="bomb-wireboard"><div class="wireboard-top">CHOISIS LE BON FIL</div><div id="rush-question" class="rush-question"></div><div class="wire-answers" id="wire-answers"></div></div><p class="rush-note">Prends ton temps : la correction complète apparaît seulement après la 10e question.</p></div>`;shell('Défi bombe · récapitulatif','Les 10 dernières questions !',body,'',()=>{},'Aucun chronomètre : réponds tranquillement.',false);document.querySelector('.actions').classList.add('hidden');const show=()=>{const q=state.bombQueue[state.bombHistory.length];document.getElementById('rush-count').textContent=(state.bombHistory.length+1)+' / 10';document.getElementById('rush-question').textContent=q.q;document.getElementById('wire-answers').innerHTML=q.opts.map((o,j)=>`<button class="wire wire-${j}" data-a="${j}"><span class="wire-dot"></span><b>${o}</b><small>Choisir</small></button>`).join('');document.querySelectorAll('.wire').forEach(b=>b.onclick=()=>{state.bombHistory.push({q,chosen:Number(b.dataset.a)});document.getElementById('rush-bomb').classList.remove('wire-cut');void document.getElementById('rush-bomb').offsetWidth;document.getElementById('rush-bomb').classList.add('wire-cut');if(state.bombHistory.length===10)finishBombRush();else show()})};show()};
finishBombRush=function(){if(state.phase==='bombDone')return;state.phase='bombDone';const good=state.bombHistory.filter(r=>r.chosen===r.q.a).length,gain=good*20;state.score+=gain;const rows=state.bombHistory.map((r,n)=>{const ok=r.chosen===r.q.a;return `<article class="bomb-review ${ok?'good':'wrong'}"><span class="review-n">${n+1}</span><div><b>${r.q.q}</b><small>Ta réponse : ${r.q.opts[r.chosen]}</small><strong>${ok?'✅ Bonne réponse':'↗️ Réponse attendue : '+r.q.opts[r.q.a]}</strong><p>${r.q.why}</p></div></article>`}).join('');const body=`<div class="bomb-result-hero"><span>💣</span><div><strong>Les 10 questions sont terminées !</strong><small>${good} bonne${good>1?'s':''} réponse${good>1?'s':''} · +${gain} points</small></div></div><div class="bomb-review-list">${rows}</div>`;shell('Défi bombe · bilan','Tes explications finales',body,'Terminer le jeu →',finishGame,'Tu peux relire les 10 réponses quand tu veux.',false);document.getElementById('points').textContent='⭐ '+state.score};
